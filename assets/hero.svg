<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Sanath Bansod cybersecurity profile header">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#07152b"/><stop offset="1" stop-color="#10051f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#7c3aed;#00e5ff" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#00e5ff;#7c3aed" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
  </defs>
  <rect x="4" y="4" width="1192" height="322" rx="24" fill="url(#bg)" stroke="#0ea5e9" stroke-opacity=".45"/>
  <rect x="4" y="4" width="1192" height="322" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="110" r="115" fill="#7c3aed" opacity=".08" filter="url(#glow)"/>
  <circle cx="1070" cy="90" r="65" fill="none" stroke="#00e5ff" stroke-opacity=".18"/>
  <circle cx="1070" cy="90" r="92" fill="none" stroke="#7c3aed" stroke-opacity=".12"/>
  <g font-family="Consolas,monospace" font-size="15" fill="#67e8f9" opacity=".8">
    <text x="55" y="62">$ whoami</text><text x="55" y="88" fill="#d1fae5">sanath-bansod</text>
    <text x="55" y="124">$ mission</text><text x="55" y="150" fill="#d1fae5">secure • learn • document</text>
  </g>
  <g text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
    <text x="600" y="105" font-size="54" font-weight="800" fill="#fff" filter="url(#glow)">SANATH BANSOD</text>
    <text x="600" y="143" font-size="18" letter-spacing="4" fill="url(#neon)">CYBERSECURITY • WEB SECURITY • VAPT</text>
    <text x="600" y="176" font-size="15" fill="#94a3b8">Reconnaissance · Security Tooling · Technical Documentation</text>
  </g>
  <g transform="translate(430 212)">
    <rect width="340" height="48" rx="12" fill="#020617" stroke="#22d3ee" stroke-opacity=".5"/>
    <circle cx="22" cy="24" r="5" fill="#22c55e"/>
    <text x="38" y="30" font-family="Consolas,monospace" font-size="15" fill="#e2e8f0">Learn → Build → Test → Verify</text>
  </g>
  <g fill="#22d3ee" opacity=".9"><circle cx="1120" cy="260" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle><circle cx="1145" cy="240" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="1090" cy="275" r="2"/></g>
</svg>
