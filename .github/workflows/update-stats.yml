name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent&title_color=22d3ee&icon_color=a78bfa&text_color=cbd5e1"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=transparent&title_color=22d3ee&text_color=cbd5e1"
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: "user=${{ github.repository_owner }}&theme=transparent&hide_border=true&ring=22d3ee&fire=a78bfa&currStreakLabel=22d3ee&sideLabels=cbd5e1&dates=94a3b8&disable_animations=true"
          path: assets/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-languages.svg assets/github-streak.svg

          if git diff --cached --quiet; then
            echo "No stats changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub profile stats"
          git push
